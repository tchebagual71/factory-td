<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + no user scaling: pinch-zoom and double-tap-zoom
         would otherwise fight every drag and tap in the game -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e0f1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Factory TD</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0f1a;
        overflow: hidden;
        /* the canvas owns every gesture: no scroll-bounce, no pull-to-refresh,
           no long-press callout, no accidental text selection while dragging */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        /* keep the canvas clear of notches and home indicators */
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }

      canvas {
        image-rendering: pixelated;
        touch-action: none;
        display: block;
      }

      /* Portrait phones/tablets: the board is a landscape 2:1 grid, so ask for a
         turn rather than rendering it postage-stamp sized. */
      #rotate {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        text-align: center;
        background: #0e0f1a;
        color: #cdd6e4;
        font: bold 16px/1.6 monospace;
        padding: 24px;
        z-index: 10;
      }

      #rotate .glyph {
        display: block;
        font-size: 56px;
        margin-bottom: 12px;
        animation: tilt 1.8s ease-in-out infinite;
      }

      @keyframes tilt {
        0%,
        60%,
        100% {
          transform: rotate(0deg);
        }
        30% {
          transform: rotate(-90deg);
        }
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: grid;
        }
        #app {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate">
      <div>
        <span class="glyph">⟳</span>
        FACTORY TD plays in landscape.<br />
        Turn your device sideways to build.
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
